# Builds the installer and the portable ZIP. Pushing a tag like `v0.2.0`
# publishes them as a GitHub Release; running it by hand ("Run workflow")
# only uploads them as build artifacts.
#
# Code signing (see docs/SIGNING.md):
# - Azure Trusted Signing: set the secrets AZURE_TENANT_ID, AZURE_CLIENT_ID,
#   AZURE_CLIENT_SECRET, AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT and
#   AZURE_SIGNING_PROFILE; every file is then signed in CI.
# - Otherwise the build is unsigned; scripts/publish-signed.ps1 can replace
#   the release files with ones signed on your own PC.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Read by Azure.CodeSigning.Dlib (DefaultAzureCredential).
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-9.0-${{ vars.FFMPEG_LICENSE || 'gpl' }}-${{ hashFiles('scripts/fetch-ffmpeg.ps1') }}

      - name: Fetch FFmpeg
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1 -License ${{ vars.FFMPEG_LICENSE || 'gpl' }}

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          $conf = Get-Content -Raw app/tauri.conf.json | ConvertFrom-Json
          $conf.version = $v
          $conf | ConvertTo-Json -Depth 32 | Set-Content -Encoding utf8NoBOM app/tauri.conf.json
          (Get-Content -Raw Cargo.toml) -replace '(?m)^version = ".*"$', "version = `"$v`"" | Set-Content -Encoding utf8NoBOM -NoNewline Cargo.toml
          "Building version $v"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up code signing
        shell: pwsh
        env:
          SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          if (-not $env:AZURE_CLIENT_ID -or -not $env:SIGNING_ACCOUNT) {
            "LANES_SIGN_MODE=none" >> $env:GITHUB_ENV
            Write-Host "No Azure Trusted Signing secrets: building unsigned."
            exit 0
          }
          $dir = Join-Path $env:RUNNER_TEMP 'trusted-signing'
          nuget install Microsoft.Trusted.Signing.Client -OutputDirectory $dir -NonInteractive | Out-Null
          $dlib = Get-ChildItem -Recurse $dir -Filter Azure.CodeSigning.Dlib.dll | Where-Object FullName -match '\\x64\\' | Select-Object -First 1
          if (-not $dlib) { throw "Azure.CodeSigning.Dlib.dll not found" }
          $meta = Join-Path $env:RUNNER_TEMP 'trusted-signing-metadata.json'
          @{ Endpoint = $env:SIGNING_ENDPOINT; CodeSigningAccountName = $env:SIGNING_ACCOUNT; CertificateProfileName = $env:SIGNING_PROFILE } |
            ConvertTo-Json | Set-Content -Encoding utf8NoBOM $meta
          "LANES_SIGN_MODE=azure" >> $env:GITHUB_ENV
          "LANES_SIGN_DLIB=$($dlib.FullName)" >> $env:GITHUB_ENV
          "LANES_SIGN_METADATA=$meta" >> $env:GITHUB_ENV
          Write-Host "Signing with Azure Trusted Signing ($env:SIGNING_ACCOUNT / $env:SIGNING_PROFILE)."

      - name: Build installer
        run: pnpm tauri build

      - name: Build portable ZIP
        shell: pwsh
        run: ./scripts/package-portable.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lanes-windows-x64
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/portable/*.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/portable/*.zip
          body: |
            **Downloads**
            - `Lanes_*_x64-setup.exe`: installer (Program Files, Start menu, uninstaller; supports admin mode).
            - `Lanes_*_x64-portable.zip`: no install, unzip and run `Lanes.exe`.

            Windows 10/11 x64. The installer adds the WebView2 runtime if it is missing.
            Feature list: [README](https://github.com/${{ github.repository }}#features) · test status: [TESTING.md](https://github.com/${{ github.repository }}/blob/main/TESTING.md)
