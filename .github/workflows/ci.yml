# Checks every push and pull request: Rust lint + tests, UI typecheck.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-9.0-${{ vars.FFMPEG_LICENSE || 'gpl' }}-${{ hashFiles('scripts/fetch-ffmpeg.ps1') }}

      - name: Fetch FFmpeg
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1 -License ${{ vars.FFMPEG_LICENSE || 'gpl' }}

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: UI typecheck
        run: pnpm typecheck

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Hardware tests (real capture/encode) are #[ignore]d; runners have no GPU.
      - name: Tests
        run: cargo test --workspace
