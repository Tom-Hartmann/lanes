[workspace]
resolver = "3"
members = ["core", "platform", "app"]

[workspace.package]
version = "0.1.7"
edition = "2024"
license = "MIT"

[workspace.dependencies]
lanes-core = { path = "core" }
lanes-platform = { path = "platform" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
windows = "0.62"
windows-core = "0.62"
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format"] }
crossbeam-channel = "0.5"
nnnoiseless = { version = "0.5", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind" # capture/encode threads catch_unwind and report instead of aborting

# bindgen (FFmpeg bindings) can overflow the stack in an unoptimised build script.
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3
